<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página não encontrada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="estrelas" aria-hidden="true"></div>
  <div class="estrelas-cintilantes" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="container">
    <svg class="planeta-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="corpoPlaneta" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#c4b5fd"/>
          <stop offset="45%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#4c1d95"/>
        </radialGradient>
      </defs>

      <ellipse class="anel anel-tras" cx="100" cy="102" rx="88" ry="22" fill="none" stroke="#c4b5fd" stroke-width="5" opacity="0.55"/>

      <g id="planetaCorpo" class="planeta-corpo">
        <circle cx="100" cy="100" r="52" fill="url(#corpoPlaneta)"/>
        <ellipse cx="78" cy="88" rx="14" ry="8" fill="#5b21b6" opacity="0.6"/>
        <ellipse cx="118" cy="112" rx="18" ry="10" fill="#6d28d9" opacity="0.5"/>
        <ellipse cx="70" cy="120" rx="10" ry="6" fill="#5b21b6" opacity="0.4"/>
      </g>

      <ellipse class="anel anel-frente" cx="100" cy="102" rx="88" ry="22" fill="none" stroke="#e9d5ff" stroke-width="6"/>
    </svg>

    <h1 class="codigo">404</h1>
    <p class="mensagem">Essa página se perdeu numa galáxia distante.</p>
    <a href="/" class="botao">Voltar ao início</a>
  </main>

  <script>
    (function () {
      var corpo = document.getElementById('planetaCorpo');
      var reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!corpo || reduzido) return;

      var duracaoMs = 14000; // uma volta completa a cada 14s
      var inicio = null;

      function passo(timestamp) {
        if (!inicio) inicio = timestamp;
        var decorrido = (timestamp - inicio) % duracaoMs;
        var angulo = (decorrido / duracaoMs) * 360;
        corpo.setAttribute('transform', 'rotate(' + angulo + ' 100 100)');
        requestAnimationFrame(passo);
      }

      requestAnimationFrame(passo);
    })();
  </script>

  <script>
    (function () {
      var reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduzido) return;

      var espacamentoPx = 10; // distância mínima entre pontos do rastro
      var estrelasPorPonto = 3; // quantas estrelas espalhadas nascem a cada ponto
      var raioEspalhamento = 40; // até quantos px cada estrela pode se afastar do ponto
      var ultimoX = null;
      var ultimoY = null;

      function criarEstrela(x, y) {
        var estrela = document.createElement('span');
        estrela.className = 'estrela-rastro';

        var tamanho = 6 + Math.random() * 10;

        var angulo = Math.random() * Math.PI * 2;
        var raio = Math.random() * raioEspalhamento;
        var offsetX = Math.cos(angulo) * raio;
        var offsetY = Math.sin(angulo) * raio;

        var derivaX = Math.cos(angulo) * (10 + Math.random() * 20);
        var derivaY = Math.sin(angulo) * (10 + Math.random() * 20);

        estrela.style.setProperty('--dx', derivaX + 'px');
        estrela.style.setProperty('--dy', derivaY + 'px');
        estrela.style.width = tamanho + 'px';
        estrela.style.height = tamanho + 'px';
        estrela.style.left = (x + offsetX - tamanho / 2) + 'px';
        estrela.style.top = (y + offsetY - tamanho / 2) + 'px';
        estrela.style.animationDelay = (Math.random() * 0.1) + 's';

        document.body.appendChild(estrela);

        estrela.addEventListener('animationend', function () {
          estrela.remove();
        });
      }

      function criarGrupo(x, y) {
        for (var i = 0; i < estrelasPorPonto; i++) {
          criarEstrela(x, y);
        }
      }

      window.addEventListener('mousemove', function (e) {
        var x = e.clientX;
        var y = e.clientY;

        if (ultimoX === null) {
          criarGrupo(x, y);
          ultimoX = x;
          ultimoY = y;
          return;
        }

        var dx = x - ultimoX;
        var dy = y - ultimoY;
        var distancia = Math.sqrt(dx * dx + dy * dy);

        if (distancia < espacamentoPx) return;

        var passos = Math.floor(distancia / espacamentoPx);
        for (var i = 1; i <= passos; i++) {
          var t = i / passos;
          criarGrupo(ultimoX + dx * t, ultimoY + dy * t);
        }

        ultimoX = x;
        ultimoY = y;
      });
    })();
  </script>
</body>
</html>
